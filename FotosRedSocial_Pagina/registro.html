<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/registro.css">
    <title>Fotos Red Social</title>
</head>

<body>
    <nav>
        <div id="logo">
            <a href="index.html">
                Fotos Red Social
            </a>
        </div>
    </nav>

    <div id="PantallaCentro">
        <div id="contenedor_registro">
            <div class="CampoCentrado">
                <div id="titulo_registro">
                    Registro
                </div>
            </div>
            <div class="CampoCentrado">
                Ingrese su correo:
            </div>
            <div class="CampoCentrado">
                <input id="Input_Correo" type="text">
            </div>
            <div class="CampoCentrado">
                Ingrese su nombre de usuario:
            </div>
            <div class="CampoCentrado">
                <input id="Input_Nombre" type="text">
            </div>
            <div class="CampoCentrado">
                Ingrese su contraseña:
            </div>
            <div class="CampoCentrado">
                <input id="Input_Contrasena" type="password">
            </div>
            <div class="CampoCentrado">
                Confirme su contraseña:
            </div>
            <div class="CampoCentrado">
                <input id="Input_ContrasenaConfirmacion" type="password">
            </div>
            <div class="CampoCentrado">
                Suba una imagen de perfil
            </div>
            <div class="CampoCentrado">
                <input id="Input_Imagen" type="file">
            </div>
            <div class="CampoCentrado">
                <img id="PreviewImagenPerfil">
            </div>
            <div class="CampoCentrado">
                (Opcional) Suba una imagen de fondo
            </div>
            <div class="CampoCentrado">
                <input id="Input_Fondo" type="file">
            </div>
            <div class="CampoCentrado">
                <img id="PreviewImagenFondo">
            </div>
            <div class="CampoCentrado">
                Imagen cover
            </div>
            <div class="CampoCentrado">
                <input id="Fondo_Cover" type="checkbox">
            </div>
            <div class="CampoCentrado">
                <button onclick="Registrarse()">Registrarse</button>
            </div>
        </div>
    </div>

</body>
<script src="js/global.js"></script>
<script src="js/registro.js"></script>
</html>
